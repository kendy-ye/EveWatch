<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EveWatch · 本地预警控制台</title>
<style>
/* ============================================================
   Design Tokens — tech-dark / industrial-utilitarian
   ============================================================ */
:root{
  --bg:            #0a0d10;
  --surface:       #11161b;
  --surface-2:     #151b21;
  --surface-3:     #1a222a;
  --surface-4:     #202a33;
  --border:        #212b34;
  --border-strong: #2d3944;

  --text:      #e3ebf2;
  --text-sub:  #8a98a6;
  --text-dim:  #5a6672;

  --primary:      #f0a02a;
  --primary-hi:   #ffb545;
  --primary-dim:  rgba(240,160,42,.14);
  --primary-line: rgba(240,160,42,.32);

  --danger:     #ff4d4d;
  --danger-dim: rgba(255,77,77,.13);

  --st-red:   #ad0606;
  --st-grey:  #6e6e6e;
  --st-blue:  #3c78dc;
  --st-orange:#d2731f;

  --font-display: "Bahnschrift", "DIN Alternate", "Segoe UI Variable Display", "Microsoft YaHei UI", sans-serif;
  --font-body:    "Segoe UI Variable Text", "Segoe UI", "Microsoft YaHei UI", "PingFang SC", sans-serif;
  --font-mono:    "Cascadia Mono", "Consolas", "SFMono-Regular", monospace;

  --r-sm: 4px;  --r-md: 6px;  --r-lg: 10px;
  --sh-1: 0 1px 2px rgba(0,0,0,.45);
  --sh-2: 0 10px 30px rgba(0,0,0,.5);

  --titlebar-h: 42px;
  --toolbar-h:  54px;
  --statusbar-h: 30px;

  --ease: cubic-bezier(.2,.7,.3,1);
}

*{ box-sizing:border-box; margin:0; padding:0; }

html,body{ height:100%; }
body{
  background:var(--bg);
  color:var(--text);
  font-family:var(--font-body);
  font-size:13px;
  line-height:1.45;
  overflow:hidden;
  -webkit-font-smoothing:antialiased;
}
body::before{
  content:""; position:fixed; inset:0; pointer-events:none; z-index:0;
  background:
    radial-gradient(720px 420px at 12% -8%, rgba(240,160,42,.09), transparent 62%),
    radial-gradient(640px 380px at 96% 4%, rgba(60,120,220,.06), transparent 60%);
}
body::after{
  content:""; position:fixed; inset:0; pointer-events:none; z-index:0; opacity:.32;
  background-image:
    linear-gradient(to right, rgba(255,255,255,.018) 1px, transparent 1px),
    linear-gradient(to bottom, rgba(255,255,255,.018) 1px, transparent 1px);
  background-size:36px 36px;
}

.ic{ flex:none; }
.ic-slot{ display:inline-flex; align-items:center; }

/* ============================================================
   Shell
   ============================================================ */
.app{
  position:relative; z-index:1;
  height:100vh; min-width:1180px;
  display:grid;
  grid-template-rows:var(--titlebar-h) var(--toolbar-h) 1fr var(--statusbar-h);
}

/* ---- Title bar ---- */
.titlebar{
  display:flex; align-items:center; gap:10px;
  padding:0 6px 0 14px;
  background:linear-gradient(180deg,#12181e,#0e1318);
  border-bottom:1px solid var(--border);
  -webkit-app-region:drag;
}
.brand{ display:flex; align-items:center; gap:9px; }
.brand-mark{
  width:18px; height:18px; border-radius:3px; position:relative;
  background:conic-gradient(from 210deg, var(--primary), #7a4a06 55%, var(--primary));
  box-shadow:0 0 12px rgba(240,160,42,.35);
}
.brand-mark::after{
  content:""; position:absolute; inset:4px; border-radius:1px; background:var(--bg);
}
.brand-name{
  font-family:var(--font-display); font-size:15px; letter-spacing:.14em;
  text-transform:uppercase; font-weight:600;
}
.brand-sub{
  font-size:11px; color:var(--text-dim); letter-spacing:.06em;
  padding-left:10px; border-left:1px solid var(--border-strong);
}
.win-controls{ margin-left:auto; display:flex; }
.win-btn{
  width:42px; height:var(--titlebar-h); border:0; background:transparent;
  color:var(--text-sub); cursor:pointer; display:grid; place-items:center;
  transition:background .12s var(--ease), color .12s var(--ease);
}
.win-btn:hover{ background:var(--surface-3); color:var(--text); }
.win-btn.close:hover{ background:#c0392b; color:#fff; }

/* ---- Toolbar ---- */
.toolbar{
  display:flex; align-items:center; gap:10px;
  padding:0 16px;
  background:var(--surface);
  border-bottom:1px solid var(--border);
}
.tb-sep{ width:1px; height:22px; background:var(--border-strong); margin:0 4px; }
.tb-spacer{ flex:1; }

.btn{
  display:inline-flex; align-items:center; gap:7px;
  height:30px; padding:0 12px;
  border:1px solid var(--border-strong); border-radius:var(--r-md);
  background:var(--surface-2); color:var(--text);
  font-family:var(--font-body); font-size:12.5px; cursor:pointer;
  transition:background .12s var(--ease), border-color .12s var(--ease), color .12s var(--ease);
  white-space:nowrap;
}
.btn:hover{ background:var(--surface-3); border-color:#3b4956; }
.btn:active{ transform:translateY(1px); }
.btn[aria-pressed="true"]{ background:var(--primary-dim); border-color:var(--primary-line); color:var(--primary-hi); }
.btn.primary{
  background:var(--primary); border-color:var(--primary); color:#1a1204; font-weight:600;
}
.btn.primary:hover{ background:var(--primary-hi); border-color:var(--primary-hi); }
.btn.running{ background:var(--danger-dim); border-color:rgba(255,77,77,.4); color:#ff8a8a; }
.btn.running:hover{ background:rgba(255,77,77,.2); }
.btn.ghost{ background:transparent; }
.btn.sm{ height:24px; padding:0 8px; font-size:11.5px; }
.btn.icon-only{ width:30px; padding:0; justify-content:center; }
.btn:disabled{ opacity:.4; cursor:not-allowed; }

.summary{ display:flex; align-items:center; gap:6px; }
.pill{
  display:inline-flex; align-items:center; gap:6px;
  height:24px; padding:0 10px; border-radius:100px;
  background:var(--surface-2); border:1px solid var(--border);
  font-size:11.5px; color:var(--text-sub); font-variant-numeric:tabular-nums;
}
.pill b{ color:var(--text); font-weight:600; font-family:var(--font-mono); font-size:11.5px; }
.pill.alarm{ background:var(--danger-dim); border-color:rgba(255,77,77,.35); color:#ff9090; }
.pill.alarm b{ color:#ff7070; }
.dot{ width:6px; height:6px; border-radius:50%; background:var(--text-dim); flex:none; }
.dot.on{ background:var(--primary); box-shadow:0 0 8px var(--primary); }
.dot.danger{ background:var(--danger); box-shadow:0 0 8px var(--danger); }

/* ---- Workspace ---- */
.workspace{
  display:grid;
  grid-template-columns:298px minmax(420px,1fr) 340px;
  min-height:0;
  background:var(--bg);
}
.col{ display:flex; flex-direction:column; min-height:0; min-width:0; }
.col-accounts{ background:var(--surface); border-right:1px solid var(--border); }
.col-detail{ background:var(--bg); }
.col-events{ background:var(--surface); border-left:1px solid var(--border); }

.col-head{
  display:flex; align-items:center; gap:8px;
  height:38px; padding:0 14px; flex:none;
  border-bottom:1px solid var(--border);
}
.col-title{
  font-family:var(--font-display); font-size:11px; letter-spacing:.12em;
  text-transform:uppercase; color:var(--text-dim);
}
.col-head .count{
  font-family:var(--font-mono); font-size:11px; color:var(--text-sub);
  padding:1px 6px; border-radius:100px; background:var(--surface-3);
}
.col-head .tb-spacer{ flex:1; }

.col-body{ flex:1; overflow-y:auto; min-height:0; }
.col-body::-webkit-scrollbar{ width:9px; }
.col-body::-webkit-scrollbar-thumb{ background:#232e38; border-radius:9px; border:2px solid transparent; background-clip:content-box; }
.col-body::-webkit-scrollbar-thumb:hover{ background:#313e4a; background-clip:content-box; }
.col-body::-webkit-scrollbar-track{ background:transparent; }

/* ---- Account list ---- */
.acc-list{ padding:6px; display:flex; flex-direction:column; gap:3px; }

.acc-row{
  position:relative;
  display:grid; grid-template-columns:14px 1fr auto; align-items:center; gap:9px;
  padding:8px 9px 8px 6px;
  border:1px solid transparent; border-radius:var(--r-md);
  background:var(--surface-2);
  cursor:pointer;
  transition:background .12s var(--ease), border-color .12s var(--ease);
}
.acc-row:hover{ background:var(--surface-3); }
.acc-row.selected{ background:var(--surface-3); border-color:var(--border-strong); }
.acc-row.selected::before{
  content:""; position:absolute; left:-6px; top:7px; bottom:7px; width:2px;
  border-radius:2px; background:var(--primary); box-shadow:0 0 10px var(--primary);
}
.acc-row.off{ opacity:.52; }
.acc-row.hostile{ background:var(--danger-dim); border-color:rgba(255,77,77,.32); }
.acc-row.hostile::before{
  content:""; position:absolute; left:-6px; top:7px; bottom:7px; width:2px;
  border-radius:2px; background:var(--danger); box-shadow:0 0 10px var(--danger);
}
.acc-row.dragging{ opacity:.35; background:var(--surface-4); }
.acc-row.flash{ animation:flash .7s ease-out 2; }
@keyframes flash{ 0%,100%{ box-shadow:0 0 0 0 rgba(255,77,77,0) } 50%{ box-shadow:0 0 0 3px rgba(255,77,77,.3) } }

.grip{ color:#3c4854; cursor:grab; display:grid; place-items:center; }
.grip:active{ cursor:grabbing; }
.acc-row:hover .grip{ color:var(--text-dim); }

.acc-main{ min-width:0; }
.acc-name{
  font-family:var(--font-mono); font-size:12.5px; letter-spacing:.01em;
  color:var(--text); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.acc-row.off .acc-name{ color:var(--text-sub); }
.acc-row.hostile .acc-name{ color:#ffb0b0; }
.acc-meta{
  display:flex; align-items:center; gap:8px; margin-top:2px;
  font-size:10.5px; color:var(--text-dim); font-variant-numeric:tabular-nums;
}
.acc-meta .m{ display:inline-flex; align-items:center; gap:4px; }
.acc-meta .m.warn{ color:#e0a45c; }
.acc-right{ display:flex; align-items:center; gap:8px; }

.badge{
  font-size:9.5px; font-family:var(--font-display); letter-spacing:.1em; text-transform:uppercase;
  padding:2px 6px; border-radius:3px; border:1px solid transparent;
}
.badge.hostile{ background:rgba(255,77,77,.16); border-color:rgba(255,77,77,.45); color:#ff9b9b; }
.badge.disabled{ background:var(--surface-4); border-color:var(--border-strong); color:var(--text-dim); }

/* switch */
.switch{
  position:relative; width:32px; height:18px; flex:none;
  border-radius:100px; background:#26313b; border:1px solid var(--border-strong);
  cursor:pointer; transition:background .16s var(--ease), border-color .16s var(--ease);
}
.switch::after{
  content:""; position:absolute; top:2px; left:2px; width:12px; height:12px; border-radius:50%;
  background:#6b7885; transition:transform .18s var(--ease), background .18s var(--ease);
}
.switch[aria-checked="true"]{ background:var(--primary-dim); border-color:var(--primary-line); }
.switch[aria-checked="true"]::after{ transform:translateX(14px); background:var(--primary); }
.switch.sm{ width:26px; height:15px; }
.switch.sm::after{ width:9px; height:9px; top:2px; left:2px; }
.switch.sm[aria-checked="true"]::after{ transform:translateX(11px); }

/* ---- Detail column ---- */
.detail-head{
  display:flex; align-items:center; gap:12px; flex:none;
  padding:14px 20px; border-bottom:1px solid var(--border);
  background:linear-gradient(180deg, rgba(240,160,42,.035), transparent);
}
.dh-name{
  font-family:var(--font-mono); font-size:15px; letter-spacing:.01em;
}
.dh-sub{ display:flex; align-items:center; gap:10px; margin-top:3px; font-size:11px; color:var(--text-dim); font-variant-numeric:tabular-nums; }
.dh-sub .sep{ width:1px; height:10px; background:var(--border-strong); }
.detail-actions{ margin-left:auto; display:flex; gap:8px; }

.roi-list{ padding:16px 20px 28px; display:flex; flex-direction:column; gap:12px; }

.roi-card{
  border:1px solid var(--border); border-radius:var(--r-lg);
  background:var(--surface-2);
  transition:border-color .14s var(--ease), background .14s var(--ease);
}
.roi-card:hover{ border-color:var(--border-strong); }
.roi-card.off{ opacity:.6; }
.roi-card.hit{ border-color:rgba(255,77,77,.42); background:linear-gradient(180deg, rgba(255,77,77,.07), transparent 60%), var(--surface-2); }

.roi-head{
  display:flex; align-items:center; gap:10px;
  padding:11px 14px; border-bottom:1px solid var(--border);
}
.roi-title{ font-size:13px; font-weight:600; letter-spacing:.01em; }
.roi-title-input{
  background:transparent; border:1px solid transparent; border-radius:var(--r-sm);
  color:var(--text); font-family:var(--font-body); font-size:13px; font-weight:600;
  padding:2px 6px; width:190px;
}
.roi-title-input:hover{ border-color:var(--border-strong); }
.roi-title-input:focus{ outline:none; border-color:var(--primary-line); background:var(--surface-3); }
.roi-head .right{ margin-left:auto; display:flex; align-items:center; gap:8px; }

.roi-body{ display:grid; grid-template-columns:58px 1fr; gap:14px; padding:13px 14px; }

/* ROI preview strip */
.roi-preview{
  width:58px; height:80px; border-radius:var(--r-sm);
  background:#070a0c; border:1px solid var(--border-strong);
  padding:4px; display:flex; flex-direction:column; gap:3px; overflow:hidden; position:relative;
}
.roi-preview .px{ height:9px; border-radius:1px; flex:none; opacity:.9; }
.roi-preview .px.empty{ background:#161d23; }
.roi-preview::after{
  content:""; position:absolute; inset:0;
  background:linear-gradient(180deg, rgba(255,255,255,.05), transparent 30%);
  pointer-events:none;
}

.roi-fields{ display:flex; flex-direction:column; gap:9px; min-width:0; }
.field{ display:grid; grid-template-columns:62px 1fr; align-items:center; gap:10px; }
.field-label{ font-size:11px; color:var(--text-dim); letter-spacing:.02em; }
.field-value{ display:flex; align-items:center; gap:8px; min-width:0; flex-wrap:wrap; }
.mono{ font-family:var(--font-mono); font-size:11.5px; color:var(--text-sub); font-variant-numeric:tabular-nums; }
.mono b{ color:var(--text); font-weight:500; }

/* color chips */
.chips{ display:flex; gap:6px; }
.chip{
  display:inline-flex; align-items:center; gap:6px;
  height:23px; padding:0 9px 0 7px; border-radius:100px;
  border:1px solid var(--border-strong); background:var(--surface-3);
  font-size:11px; color:var(--text-sub); cursor:pointer;
  transition:border-color .12s var(--ease), color .12s var(--ease), background .12s var(--ease);
}
.chip:hover{ border-color:#3b4956; color:var(--text); }
.chip .sw{ width:8px; height:8px; border-radius:2px; flex:none; }
.chip[aria-pressed="true"]{ background:var(--surface-4); border-color:#47576a; color:var(--text); }
.chip[aria-pressed="true"] .sw{ box-shadow:0 0 0 2px rgba(255,255,255,.14); }

/* audio select trigger */
.audio-trigger{
  display:inline-flex; align-items:center; gap:8px;
  height:28px; padding:0 9px; min-width:168px;
  border:1px solid var(--border-strong); border-radius:var(--r-md);
  background:var(--surface-3); color:var(--text); cursor:pointer;
  font-size:12px; transition:border-color .12s var(--ease), background .12s var(--ease);
}
.audio-trigger:hover{ background:var(--surface-4); border-color:#47576a; }
.audio-trigger .label{ flex:1; text-align:left; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.audio-trigger.custom .label{ font-family:var(--font-mono); font-size:11px; color:var(--primary-hi); }
.audio-trigger .caret{ color:var(--text-dim); transition:transform .16s var(--ease); }
.audio-trigger.open{ border-color:var(--primary-line); }
.audio-trigger.open .caret{ transform:rotate(180deg); }

/* popover */
.popover{
  position:fixed; z-index:90; min-width:250px;
  background:var(--surface-3); border:1px solid var(--border-strong); border-radius:var(--r-md);
  box-shadow:var(--sh-2); padding:5px;
  animation:pop .14s var(--ease) both;
}
@keyframes pop{ from{ opacity:0; transform:translateY(-4px) scale(.985) } to{ opacity:1; transform:none } }
.pop-item{
  display:flex; align-items:center; gap:9px;
  padding:7px 9px; border-radius:var(--r-sm); cursor:pointer;
  transition:background .1s var(--ease);
}
.pop-item:hover{ background:var(--surface-4); }
.pop-item .pi-name{ font-size:12px; display:block; }
.pop-item .pi-desc{ font-size:10.5px; color:var(--text-dim); margin-top:1px; display:block; }
.pop-item .pi-main{ flex:1; min-width:0; display:flex; flex-direction:column; }
.pop-item .pi-check{ color:var(--primary); opacity:0; }
.pop-item[aria-selected="true"] .pi-check{ opacity:1; }
.pop-sep{ height:1px; background:var(--border-strong); margin:5px 4px; }
.pop-wave{
  width:26px; height:16px; flex:none; display:flex; align-items:center; gap:1.5px;
}
.pop-wave i{ flex:1; background:var(--text-dim); border-radius:1px; }

/* volume */
.range{ -webkit-appearance:none; appearance:none; width:118px; height:16px; background:transparent; cursor:pointer; }
.range::-webkit-slider-runnable-track{ height:3px; border-radius:3px; background:#2b3640; }
.range::-webkit-slider-thumb{
  -webkit-appearance:none; width:11px; height:11px; margin-top:-4px; border-radius:50%;
  background:var(--primary); box-shadow:0 0 0 3px rgba(240,160,42,.16);
}
.range::-moz-range-track{ height:3px; border-radius:3px; background:#2b3640; }
.range::-moz-range-thumb{ width:11px; height:11px; border:0; border-radius:50%; background:var(--primary); }

/* empty state */
.empty{
  margin:auto; padding:40px 24px; text-align:center; max-width:340px;
}
.empty .mark{
  width:56px; height:56px; margin:0 auto 14px; border-radius:var(--r-lg);
  display:grid; place-items:center; color:var(--text-dim);
  border:1px dashed var(--border-strong); background:var(--surface);
}
.empty h3{ font-family:var(--font-display); font-size:14px; letter-spacing:.04em; font-weight:600; }
.empty p{ margin:7px 0 16px; font-size:12px; color:var(--text-dim); line-height:1.6; }

/* ---- Event column ---- */
.ev-list{ padding:6px 6px 16px; display:flex; flex-direction:column; gap:2px; }
.ev{
  display:grid; grid-template-columns:auto 1fr; gap:10px;
  padding:8px 10px; border-radius:var(--r-md);
  border-left:2px solid transparent;
  transition:background .12s var(--ease);
}
.ev:hover{ background:var(--surface-2); }
.ev .t{ font-family:var(--font-mono); font-size:10.5px; color:var(--text-dim); padding-top:1px; }
.ev .c{ font-size:11.5px; color:var(--text-sub); }
.ev .c b{ color:var(--text); font-weight:500; font-family:var(--font-mono); font-size:11px; }
.ev .c .tagline{ display:block; margin-top:2px; color:var(--text-dim); font-size:10.5px; }
.ev.hit{ border-left-color:var(--danger); background:var(--danger-dim); }
.ev.hit .c{ color:#ffb4b4; }
.ev.hit .c b{ color:#ff8f8f; }
.ev.info{ border-left-color:var(--border-strong); }
.ev.warn{ border-left-color:#c98a2e; }

/* ---- Status bar ---- */
.statusbar{
  display:flex; align-items:center; gap:0;
  padding:0 16px; background:var(--surface);
  border-top:1px solid var(--border);
  font-size:11px; color:var(--text-dim); font-variant-numeric:tabular-nums;
}
.sb-item{ display:flex; align-items:center; gap:6px; padding:0 12px; height:100%; }
.sb-item + .sb-item{ border-left:1px solid var(--border); }
.sb-item b{ font-family:var(--font-mono); color:var(--text-sub); font-weight:500; }
.sb-item.warn b{ color:#e0a45c; }

/* ---- Toast ---- */
.toast-host{ position:fixed; right:18px; bottom:44px; z-index:120; display:flex; flex-direction:column; gap:8px; align-items:flex-end; }
.toast{
  display:flex; align-items:center; gap:9px;
  padding:9px 13px; border-radius:var(--r-md);
  background:var(--surface-3); border:1px solid var(--border-strong);
  box-shadow:var(--sh-2); font-size:12px; color:var(--text);
  animation:toastIn .22s var(--ease) both;
}
.toast.out{ animation:toastOut .2s var(--ease) both; }
.toast .ic{ color:var(--primary); }
@keyframes toastIn{ from{ opacity:0; transform:translateX(14px) } to{ opacity:1; transform:none } }
@keyframes toastOut{ to{ opacity:0; transform:translateX(14px) } }

/* ---- Modal ---- */
.backdrop{
  position:fixed; inset:0; z-index:100; background:rgba(4,6,8,.68);
  backdrop-filter:blur(3px); display:grid; place-items:center;
  animation:fade .16s var(--ease) both;
}
@keyframes fade{ from{opacity:0} to{opacity:1} }
.modal{
  width:420px; background:var(--surface-2);
  border:1px solid var(--border-strong); border-radius:var(--r-lg);
  box-shadow:var(--sh-2); overflow:hidden;
  animation:pop .2s var(--ease) both;
}
.modal-head{
  display:flex; align-items:center; gap:9px; padding:14px 16px;
  border-bottom:1px solid var(--border);
}
.modal-head h3{ font-family:var(--font-display); font-size:13px; letter-spacing:.06em; text-transform:uppercase; }
.modal-body{ padding:16px; display:flex; flex-direction:column; gap:10px; }
.path-box{
  display:flex; align-items:center; gap:8px;
  padding:9px 11px; border-radius:var(--r-md);
  background:var(--bg); border:1px solid var(--border-strong);
  font-family:var(--font-mono); font-size:11.5px; color:var(--text);
}
.path-box .ic{ color:var(--primary); }
.path-box span{ flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.hint{ font-size:11px; color:var(--text-dim); line-height:1.6; }
.modal-foot{ display:flex; justify-content:flex-end; gap:8px; padding:0 16px 16px; }

/* ---- header mini actions ---- */
.head-actions{ display:flex; align-items:center; gap:2px; }
.mini-btn{
  display:inline-flex; align-items:center; gap:4px;
  height:22px; padding:0 7px;
  border:1px solid transparent; border-radius:var(--r-sm);
  background:transparent; color:var(--text-dim);
  font-family:var(--font-body); font-size:11px; cursor:pointer;
  transition:background .12s var(--ease), color .12s var(--ease), border-color .12s var(--ease);
}
.mini-btn:hover{ background:var(--surface-3); color:var(--text); border-color:var(--border-strong); }
.mini-btn:active{ transform:translateY(1px); }

/* ============================================================
   ROI 并排显示 · 置顶窗
   ============================================================ */
.wall{
  position:fixed; z-index:80; width:648px;
  background:var(--surface); border:1px solid var(--border-strong);
  border-radius:var(--r-lg); box-shadow:0 20px 54px rgba(0,0,0,.62), 0 0 0 1px rgba(0,0,0,.4);
  overflow:hidden; animation:pop .2s var(--ease) both;
}
.wall-bar{
  display:flex; align-items:center; gap:9px;
  height:32px; padding:0 8px 0 12px;
  background:linear-gradient(180deg,#161d24,#111619);
  border-bottom:1px solid var(--border); cursor:grab; user-select:none;
}
.wall-bar:active{ cursor:grabbing; }
.wall-title{
  font-family:var(--font-display); font-size:11px; letter-spacing:.11em;
  text-transform:uppercase; color:var(--text-sub);
}
.wall-pin{
  display:inline-flex; align-items:center; gap:5px;
  height:19px; padding:0 8px; border-radius:100px;
  background:var(--primary-dim); border:1px solid var(--primary-line);
  color:var(--primary-hi); font-size:10px; letter-spacing:.02em;
}
.wall-stat{
  margin-left:auto; font-family:var(--font-mono); font-size:10.5px; color:var(--text-dim);
}
.wall-body{
  display:flex; align-items:flex-start; gap:5px;
  padding:12px; background:var(--bg);
  max-height:212px; overflow-x:auto; overflow-y:hidden;
}
.wall-body::-webkit-scrollbar{ height:8px; }
.wall-body::-webkit-scrollbar-thumb{ background:#232e38; border-radius:8px; border:2px solid transparent; background-clip:content-box; }
.wall-strip{
  flex:none; width:48px; padding:5px 3px;
  display:flex; flex-direction:column; align-items:center; gap:4px;
  border:1px solid transparent; border-radius:var(--r-sm);
  cursor:pointer;
  transition:background .18s var(--ease), border-color .18s var(--ease), box-shadow .18s var(--ease);
}
.wall-strip:hover{ background:var(--surface-2); border-color:var(--border-strong); }
.wall-strip.alarm{
  background:var(--danger-dim); border-color:rgba(255,77,77,.5);
  box-shadow:inset 0 0 22px rgba(255,77,77,.16), 0 0 16px rgba(255,77,77,.14);
}
.wall-strip.focused{ border-color:var(--primary-line); background:var(--primary-dim); }
.wall-strip.alarm.focused{ border-color:rgba(255,120,120,.72); }
.wall-name{
  width:40px; text-align:center;
  font-family:var(--font-mono); font-size:9.5px; color:var(--text-sub);
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
}
.wall-strip.alarm .wall-name{ color:#ffa3a3; }
.wall-col{
  width:26px; padding:2px; border-radius:3px;
  background:#070a0c; border:1px solid var(--border-strong);
  display:flex; flex-direction:column; gap:2px;
}
.wall-col i{ display:block; height:7px; border-radius:1px; }
.wall-strip.alarm .wall-col{ border-color:rgba(255,77,77,.45); }
.wall-tag{ font-family:var(--font-mono); font-size:9px; color:var(--text-dim); }

/* ============================================================
   对话框 · 选项列表
   ============================================================ */
.notice{
  display:flex; gap:9px; padding:10px 12px; border-radius:var(--r-md);
  background:rgba(240,160,42,.07); border:1px solid var(--primary-line);
  color:#d9ae6c; font-size:11.5px; line-height:1.6;
}
.notice .ic{ margin-top:2px; flex:none; }
.opt-list{ display:flex; flex-direction:column; gap:2px; }
.opt{
  display:flex; align-items:center; gap:10px;
  padding:9px 10px; border-radius:var(--r-md);
  border:1px solid transparent; cursor:pointer;
  transition:background .12s var(--ease), border-color .12s var(--ease);
}
.opt:hover{ background:var(--surface-3); }
.opt.on{ background:var(--surface-3); border-color:var(--border-strong); }
.checkbox{
  width:16px; height:16px; flex:none; border-radius:3px;
  border:1px solid var(--border-strong); background:var(--surface);
  display:grid; place-items:center; color:transparent;
  transition:background .12s var(--ease), border-color .12s var(--ease);
}
.opt.on .checkbox{ background:var(--primary); border-color:var(--primary); color:#1a1204; }
.opt-main{ flex:1; min-width:0; }
.opt-label{ font-size:12.5px; }
.opt-desc{ font-size:10.5px; color:var(--text-dim); margin-top:1px; }
.src-box{
  display:flex; align-items:center; gap:9px;
  padding:10px 12px; border-radius:var(--r-md);
  background:var(--bg); border:1px solid var(--border-strong);
}
.src-box .k{ font-size:11px; color:var(--text-dim); }
.src-box .v{ font-family:var(--font-mono); font-size:12px; color:var(--text); }
.src-box .arrow{ color:var(--text-dim); }
.src-box .to{ font-family:var(--font-mono); font-size:12px; color:var(--primary-hi); }

/* ============================================================
   颜色提取器
   ============================================================ */
.picker-cols{ display:grid; grid-template-columns:252px 1fr; gap:16px; }
.pg-cap{ display:flex; align-items:center; justify-content:space-between; margin-bottom:7px; }
.pg-cap .t{ font-size:11px; color:var(--text-dim); }
.pg-cap .mono{ font-size:10.5px; }
.pg{
  display:grid;
  grid-template-columns:repeat(16, 1fr);
  grid-template-rows:repeat(16, 1fr);
  width:252px; height:252px;
  border:1px solid var(--border-strong); border-radius:var(--r-sm);
  overflow:hidden; background:#0b0f13; cursor:crosshair;
}
.pg i{ display:block; }
.pg i:hover{ position:relative; z-index:1; outline:1px solid #fff; outline-offset:-1px; }
.swatch{
  display:flex; align-items:center; gap:11px;
  padding:11px 12px; border-radius:var(--r-md);
  background:var(--bg); border:1px solid var(--border-strong);
}
.swatch .big{ width:40px; height:40px; flex:none; border-radius:var(--r-sm); border:1px solid rgba(255,255,255,.18); }
.swatch .meta{ min-width:0; }
.swatch .hex{ font-family:var(--font-mono); font-size:15px; letter-spacing:.02em; }
.swatch .nm{ font-size:11px; color:var(--text-dim); margin-top:2px; }
.io{ display:grid; grid-template-columns:44px 1fr; align-items:center; gap:9px; }
.io .k{ font-size:11px; color:var(--text-dim); }
.inp{
  height:28px; width:100%; padding:0 9px; border-radius:var(--r-md);
  background:var(--surface-3); border:1px solid var(--border-strong);
  color:var(--text); font-family:var(--font-mono); font-size:12px;
}
.inp::placeholder{ color:#46525e; font-family:var(--font-body); }
.inp:focus{ outline:none; border-color:var(--primary-line); background:var(--surface-4); }
.inp.rgb3{ width:58px; }
.pal-list{ display:flex; flex-wrap:wrap; gap:6px; }
.pal-item{
  display:inline-flex; align-items:center; gap:7px;
  height:26px; padding:0 5px 0 8px; border-radius:100px;
  background:var(--surface-3); border:1px solid var(--border-strong);
  font-size:11px; color:var(--text-sub);
}
.pal-item .sw2{ width:10px; height:10px; flex:none; border-radius:2px; }
.pal-item .rm{
  width:16px; height:16px; flex:none; border:0; border-radius:50%;
  background:transparent; color:var(--text-dim); cursor:pointer;
  display:grid; place-items:center;
}
.pal-item .rm:hover{ background:rgba(255,77,77,.18); color:#ff8f8f; }
.chip.add{ border-style:dashed; padding:0 10px; }
.chip.add:hover{ color:var(--primary-hi); border-color:var(--primary-line); }

/* ============================================================
   游戏布局同步 · 独立窗口
   ============================================================ */
.sync{
  position:fixed; z-index:82; width:944px;
  display:flex; flex-direction:column;
  max-height:calc(100vh - 96px);
  background:var(--surface); border:1px solid var(--border-strong);
  border-radius:var(--r-lg); box-shadow:0 24px 60px rgba(0,0,0,.66), 0 0 0 1px rgba(0,0,0,.4);
  overflow:hidden; animation:pop .2s var(--ease) both;
}
.sync-bar{
  display:flex; align-items:center; gap:9px; flex:none;
  height:34px; padding:0 8px 0 12px;
  background:linear-gradient(180deg,#161d24,#111619);
  border-bottom:1px solid var(--border); cursor:grab; user-select:none;
}
.sync-bar:active{ cursor:grabbing; }
.sync-title{
  font-family:var(--font-display); font-size:11px; letter-spacing:.11em;
  text-transform:uppercase; color:var(--text-sub);
}
.guard{
  display:inline-flex; align-items:center; gap:6px;
  height:21px; padding:0 9px; border-radius:100px; cursor:pointer;
  font-size:10.5px; border:1px solid var(--border-strong);
  background:var(--surface-3); color:var(--text-sub);
  transition:background .14s var(--ease), border-color .14s var(--ease), color .14s var(--ease);
}
.guard:hover{ border-color:#3b4956; }
.guard.ok{ background:rgba(240,160,42,.1); border-color:var(--primary-line); color:var(--primary-hi); }
.guard.bad{ background:var(--danger-dim); border-color:rgba(255,77,77,.45); color:#ff9b9b; }

.sync-toolbar{
  display:flex; align-items:center; gap:12px; flex:none;
  padding:12px 14px; border-bottom:1px solid var(--border);
}
.fld{ display:flex; align-items:center; gap:7px; }
.fld .k{ font-size:11px; color:var(--text-dim); }
.selwrap{ position:relative; display:inline-flex; align-items:center; }
.sel{
  appearance:none; -webkit-appearance:none;
  height:28px; width:214px; padding:0 26px 0 10px;
  border:1px solid var(--border-strong); border-radius:var(--r-md);
  background:var(--surface-3); color:var(--text);
  font-family:var(--font-body); font-size:11.5px; cursor:pointer;
}
.sel:focus{ outline:none; border-color:var(--primary-line); }
.selwrap .selcaret{ position:absolute; right:8px; display:flex; color:var(--text-dim); pointer-events:none; }
.seg{
  display:inline-flex; padding:2px; gap:2px;
  border:1px solid var(--border-strong); border-radius:var(--r-md); background:var(--surface-3);
}
.seg button{
  height:22px; padding:0 12px; border:0; border-radius:var(--r-sm);
  background:transparent; color:var(--text-sub);
  font-family:var(--font-body); font-size:11.5px; cursor:pointer;
  transition:background .12s var(--ease), color .12s var(--ease);
}
.seg button:hover{ color:var(--text); }
.seg button.on{ background:var(--surface-4); color:var(--text); box-shadow:var(--sh-1); }

.sync-warn{
  display:flex; gap:9px; flex:none;
  margin:12px 14px 0; padding:9px 12px; border-radius:var(--r-md);
  background:rgba(240,160,42,.07); border:1px solid var(--primary-line);
  color:#d9ae6c; font-size:11.5px; line-height:1.6;
}
.sync-warn .ic{ margin-top:1px; flex:none; }
.sync-warn.blocked{ background:var(--danger-dim); border-color:rgba(255,77,77,.4); color:#ffb0b0; }

.sync-cols{ display:grid; grid-template-columns:1fr 1.18fr; gap:14px; padding:12px 14px; min-height:0; }
.pane{ display:flex; flex-direction:column; min-height:0; min-width:0; }
.pane-head{ display:flex; align-items:center; gap:6px; flex:none; margin-bottom:7px; }
.pane-title{ font-size:11.5px; color:var(--text-sub); }
.pane-box{
  flex:1; min-height:132px; max-height:232px; overflow-y:auto;
  padding:4px; border:1px solid var(--border); border-radius:var(--r-md);
  background:var(--surface-2);
}
.pane-box::-webkit-scrollbar{ width:8px; }
.pane-box::-webkit-scrollbar-thumb{ background:#232e38; border-radius:8px; border:2px solid transparent; background-clip:content-box; }

.row{
  display:grid; grid-template-columns:16px minmax(0,1fr) auto;
  align-items:center; gap:9px;
  padding:7px 9px; border-radius:var(--r-sm); cursor:pointer;
  transition:background .12s var(--ease), box-shadow .12s var(--ease);
}
.row:hover{ background:var(--surface-3); }
.row.on{ background:var(--surface-4); }
.row.src{ background:var(--primary-dim); box-shadow:inset 2px 0 0 var(--primary); cursor:default; }
.row-main{ min-width:0; }
.row-name{
  display:flex; align-items:center; gap:7px;
  font-family:var(--font-mono); font-size:12px; color:var(--text);
  white-space:nowrap; overflow:hidden;
}
.row-name .id{ color:var(--text-dim); font-size:10.5px; }
.row-sub{ margin-top:1px; font-size:10.5px; color:var(--text-dim); font-variant-numeric:tabular-nums; }
.cbox{
  width:15px; height:15px; flex:none; border-radius:3px;
  border:1px solid var(--border-strong); background:var(--surface);
  display:grid; place-items:center; color:transparent;
}
.row.on .cbox{ background:var(--primary); border-color:var(--primary); color:#1a1204; }
.rad{
  width:14px; height:14px; flex:none; border-radius:50%;
  border:1px solid var(--border-strong); background:var(--surface);
  display:grid; place-items:center;
}
.rad::after{ content:""; width:6px; height:6px; border-radius:50%; background:transparent; }
.row.src .rad{ border-color:var(--primary); }
.row.src .rad::after{ background:var(--primary); }
.st{
  font-family:var(--font-display); font-size:9.5px; letter-spacing:.08em;
  padding:2px 6px; border-radius:3px; border:1px solid transparent; white-space:nowrap;
}
.st.same{ background:var(--surface-4); border-color:var(--border-strong); color:var(--text-dim); }
.st.diff{ background:var(--primary-dim); border-color:var(--primary-line); color:var(--primary-hi); }
.st.src{ background:rgba(60,120,220,.15); border-color:rgba(60,120,220,.42); color:#8ab4f0; }
.alias-inp{
  height:20px; width:100%; max-width:170px; padding:0 6px;
  border:1px solid transparent; border-radius:var(--r-sm);
  background:transparent; color:var(--text);
  font-family:var(--font-body); font-size:11.5px;
}
.alias-inp:hover{ border-color:var(--border-strong); }
.alias-inp:focus{ outline:none; background:var(--surface-3); border-color:var(--primary-line); }

.sync-foot{ display:flex; align-items:center; gap:10px; flex:none; padding:0 14px 12px; }
.sync-status{ flex:1; min-width:0; font-size:11.5px; color:var(--text-sub); }
.sync-status b{ font-family:var(--font-mono); color:var(--text); font-weight:500; }
.sync-log{
  flex:none; height:108px; margin:0 14px 14px; padding:9px 11px;
  border:1px solid var(--border); border-radius:var(--r-md);
  background:#080b0e; overflow-y:auto;
  font-family:var(--font-mono); font-size:11px; line-height:1.75;
}
.sync-log::-webkit-scrollbar{ width:8px; }
.sync-log::-webkit-scrollbar-thumb{ background:#232e38; border-radius:8px; border:2px solid transparent; background-clip:content-box; }
.sync-log div{ white-space:pre-wrap; word-break:break-all; }
.l-info{ color:var(--text-dim); }
.l-ok{ color:var(--text); }
.l-warn{ color:#e0a45c; }
.l-err{ color:#ff8f8f; }
.ts{ color:#3f4b57; }

/* ---- boot choreography ---- */
.reveal{ animation:rise .42s var(--ease) both; }
@keyframes rise{ from{ opacity:0; transform:translateY(7px) } to{ opacity:1; transform:none } }
.boot-row{ animation:rise .34s var(--ease) both; }

@media (max-width:1320px){
  .workspace{ grid-template-columns:270px 1fr 288px; }
  .wall{ width:566px; }
}
@media (max-width:1200px){
  .workspace{ grid-template-columns:260px 1fr; }
  .col-events{ display:none; }
}
</style>
</head>
<body>

<div class="app">

  <!-- Title bar -->
  <header class="titlebar reveal" style="animation-delay:.02s">
    <div class="brand">
      <div class="brand-mark"></div>
      <span class="brand-name">EveWatch</span>
      <span class="brand-sub">本地预警控制台</span>
    </div>
    <div class="win-controls">
      <button class="win-btn" title="最小化">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="5" y1="12" x2="19" y2="12"/></svg>
      </button>
      <button class="win-btn" title="最大化">
        <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="4" width="16" height="16" rx="1"/></svg>
      </button>
      <button class="win-btn close" title="关闭">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
      </button>
    </div>
  </header>

  <!-- Toolbar -->
  <div class="toolbar reveal" style="animation-delay:.06s">
    <button class="btn primary" id="btnMonitor">
      <span class="ic-slot" data-icon="play"></span><span id="btnMonitorLabel">开始监控</span>
    </button>
    <button class="btn" id="btnMute" aria-pressed="false">
      <span class="ic-slot" data-icon="volume2"></span><span id="btnMuteLabel">全局静音</span>
    </button>
    <div class="tb-sep"></div>
    <button class="btn ghost" id="btnClone">
      <span class="ic-slot" data-icon="copy"></span>账号配置克隆
    </button>
    <button class="btn ghost" id="btnWall" aria-pressed="false">
      <span class="ic-slot" data-icon="layoutGrid"></span>ROI 并排
    </button>
    <button class="btn ghost" id="btnLayoutSync" aria-pressed="false">
      <span class="ic-slot" data-icon="layoutTemplate"></span>游戏布局同步
    </button>
    <button class="btn ghost icon-only" id="btnSettings" title="设置">
      <span class="ic-slot" data-icon="settings"></span>
    </button>
    <div class="tb-sep"></div>
    <button class="btn ghost" id="btnDemo">
      <span class="ic-slot" data-icon="zap"></span>模拟报警
    </button>
    <div class="tb-spacer"></div>
    <div class="summary">
      <span class="pill"><span class="dot on"></span>客户端 <b id="sumClients">10</b></span>
      <span class="pill"><span class="dot on"></span>监控中 <b id="sumEnabled">8</b></span>
      <span class="pill alarm" id="sumAlarm" hidden><span class="dot danger"></span>敌对 <b id="sumHostile">1</b></span>
    </div>
  </div>

  <!-- Workspace -->
  <main class="workspace">

    <!-- Accounts -->
    <aside class="col col-accounts reveal" style="animation-delay:.12s">
      <div class="col-head">
        <span class="col-title">客户端</span>
        <span class="count" id="accCount">10</span>
        <div class="tb-spacer"></div>
        <div class="head-actions">
          <button class="mini-btn" id="btnSelectAll" title="全部启用监控">
            <span class="ic-slot" data-icon="checkSquare" data-size="13"></span>全选
          </button>
          <button class="mini-btn" id="btnInvert" title="启用状态取反">
            <span class="ic-slot" data-icon="arrowLeftRight" data-size="13"></span>反选
          </button>
          <button class="mini-btn" id="btnRefresh" title="重新枚举窗口">
            <span class="ic-slot" data-icon="refresh" data-size="13"></span>
          </button>
        </div>
      </div>
      <div class="col-body">
        <div class="acc-list" id="accList"></div>
      </div>
    </aside>

    <!-- Detail -->
    <section class="col col-detail reveal" style="animation-delay:.18s">
      <div id="detailHost" style="display:flex; flex-direction:column; min-height:0; flex:1;"></div>
    </section>

    <!-- Events -->
    <aside class="col col-events reveal" style="animation-delay:.24s">
      <div class="col-head">
        <span class="col-title">事件</span>
        <div class="tb-spacer"></div>
        <button class="btn ghost icon-only sm" id="btnClearLog" title="清空">
          <span class="ic-slot" data-icon="trash"></span>
        </button>
      </div>
      <div class="col-body">
        <div class="ev-list" id="evList"></div>
      </div>
    </aside>

  </main>

  <!-- Status bar -->
  <footer class="statusbar reveal" style="animation-delay:.3s">
    <div class="sb-item"><span class="ic-slot" data-icon="radio"></span>采集 <b>WGC</b></div>
    <div class="sb-item">节拍 <b id="sbTick">400</b> ms</div>
    <div class="sb-item">CPU <b id="sbCpu">1.8%</b></div>
    <div class="sb-item">内存 <b id="sbMem">62 MB</b></div>
    <div class="sb-item">显存 <b id="sbVram">412 MB</b></div>
    <div class="sb-item warn">丢帧 <b id="sbDrop">12</b></div>
    <div class="tb-spacer"></div>
    <div class="sb-item">配置 <b>evewatch.json</b></div>

/* ============================================================
   Persistence — account order
   ============================================================ */
const ORDER_KEY = 'evewatch.accountOrder';
function loadOrder(){
  try{
    const raw = localStorage.getItem(ORDER_KEY);
    if (!raw) return;
    const ids = JSON.parse(raw);
    const map = new Map(state.accounts.map(function(a){ return [a.id, a]; }));
    const ordered = ids.map(function(id){ return map.get(id); }).filter(Boolean);
    state.accounts.forEach(function(a){ if (ids.indexOf(a.id) === -1) ordered.push(a); });
    state.accounts = ordered;
  }catch(e){ /* 首次运行或本地存储不可用，按默认顺序 */ }
}
function saveOrder(){
  try{
    localStorage.setItem(ORDER_KEY, JSON.stringify(state.accounts.map(function(a){ return a.id; })));
  }catch(e){ /* 本地存储不可用，本次会话内仍保持顺序 */ }
}

/* ============================================================
   Helpers
   ============================================================ */
function $(sel, root){ return (root || document).querySelector(sel); }
function $$(sel, root){ return Array.prototype.slice.call((root || document).querySelectorAll(sel)); }
function accById(id){ return state.accounts.find(function(a){ return a.id === id; }); }
function audioById(id){ return AUDIO_PRESETS.find(function(p){ return p.id === id; }); }
function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c]; }); }
function audioLabel(roi){
  if (roi.audio === 'custom') return roi.customFile ? roi.customFile.split('\\').pop() : '自定义文件…';
  const p = audioById(roi.audio);
  return p ? p.name : '未选择';
}
function isHitRoi(roi){ return roi.hits > 0; }

function toast(msg, iconName){
  const host = $('#toastHost');
  const el = document.createElement('div');
  el.className = 'toast';
  el.innerHTML = ic(iconName || 'check', 15) + '<span>' + esc(msg) + '</span>';
  host.appendChild(el);
  setTimeout(function(){
    el.classList.add('out');
    setTimeout(function(){ el.remove(); }, 220);
  }, 2200);
}

/* ============================================================
   Audio preview — Web Audio, no asset files
   ============================================================ */
let audioCtx = null;
function playPreset(preset, volume){
  if (state.muted) { toast('全局静音已开启，不出声', 'volumeX'); return; }
  try{
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const t0 = audioCtx.currentTime;
    const gainScale = Math.max(0.05, (volume == null ? 80 : volume) / 100) * 0.22;
    preset.pattern.forEach(function(step){
      const freq = step[0], delay = step[1] / 1000, dur = step[2] / 1000;
      const osc = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      osc.type = preset.wave || 'triangle';
      osc.frequency.value = freq;
      const start = t0 + delay, end = start + dur;
      g.gain.setValueAtTime(0.0001, start);
      g.gain.linearRampToValueAtTime(gainScale, start + 0.012);
      g.gain.exponentialRampToValueAtTime(0.0001, end);
      osc.connect(g); g.connect(audioCtx.destination);
      osc.start(start); osc.stop(end + 0.03);
    });
  }catch(e){ toast('音频设备不可用', 'alert'); }
}
function playRoi(roi){
  if (roi.audio === 'custom'){ toast('试听自定义文件：' + audioLabel(roi), 'volume2'); return; }
  const p = audioById(roi.audio);
  if (!p) { toast('该 ROI 未选择报警音频', 'alert'); return; }
  playPreset(p, roi.volume);
  toast('试听：' + p.name, 'volume2');
}

const accList = $('#accList');

accList.addEventListener('click', function(e){

  if (toggle){
    const a = accById(toggle.dataset.id);

});

accList.addEventListener('keydown', function(e){
  if (e.key !== 'Enter' && e.key !== ' ') return;
  const toggle = e.target.closest('[data-act="toggle-acc"]');
  if (!toggle) return;
  e.preventDefault();
  toggle.click();
});

/* drag sort */
accList.addEventListener('dragstart', function(e){
  const row = e.target.closest('.acc-row');
  if (!row) return;
  dragId = row.dataset.id;
  row.classList.add('dragging');
  e.dataTransfer.effectAllowed = 'move';
  try{ e.dataTransfer.setData('text/plain', dragId); }catch(err){}
});
accList.addEventListener('dragover', function(e){
  e.preventDefault();
  const dragging = accList.querySelector('.acc-row.dragging');
  if (!dragging) return;
  const after = rowAfter(accList, e.clientY);
  if (after == null) accList.appendChild(dragging);
  else accList.insertBefore(dragging, after);
});
accList.addEventListener('dragend', function(){
  const dragging = accList.querySelector('.acc-row.dragging');
  if (dragging) dragging.classList.remove('dragging');
  if (!dragId) return;
  const ids = $$('.acc-row', accList).map(function(r){ return r.dataset.id; });
  state.accounts.sort(function(x, y){ return ids.indexOf(x.id) - ids.indexOf(y.id); });
  saveOrder();
  dragId = null;
  toast('账号顺序已保存', 'check');
});
function rowAfter(container, y){
  const rows = $$('.acc-row:not(.dragging)', container);
  for (let i = 0; i < rows.length; i++){
    const box = rows[i].getBoundingClientRect();
    if (y < box.top + box.height / 2) return rows[i];
  }
  return null;
}

/* ============================================================
   Audio popover
   ============================================================ */
let activePopover = null;
function closePopover(){
  if (activePopover){ activePopover.remove(); activePopover = null; }
  $$('.audio-trigger.open').forEach(function(t){ t.classList.remove('open'); });
}
function openAudioPopover(trigger, roi){
  if (activePopover && activePopover.dataset.roi === roi.id){ closePopover(); return; }
  closePopover();
  trigger.classList.add('open');

  const pop = document.createElement('div');
  pop.className = 'popover';
  pop.dataset.roi = roi.id;

  const waves = [4, 9, 14, 7, 16];
  let html = '<div style="padding:7px 9px 5px; font-size:10.5px; letter-spacing:.1em; text-transform:uppercase; color:var(--text-dim); font-family:var(--font-display)">内置音频</div>';
  AUDIO_PRESETS.forEach(function(p){
    const bars = p.pattern.map(function(_, i){
      const h = waves[i % waves.length];
      return '<i style="height:' + h + 'px"></i>';
    }).join('');
    html += '<div class="pop-item" data-pick="' + p.id + '" aria-selected="' + (roi.audio === p.id) + '">'
         +    '<span class="pop-wave">' + bars + '</span>'
         +    '<span class="pi-main"><span class="pi-name">' + p.name + '</span><span class="pi-desc">' + p.desc + '</span></span>'
         +    '<span class="pi-check">' + ic('check', 14) + '</span>'
         +  '</div>';
  });
  html += '<div class="pop-sep"></div>';
  html += '<div class="pop-item" data-pick="__custom">'
       +    '<span class="pop-wave" style="color:var(--text-dim)">' + ic('folder', 16) + '</span>'
       +    '<span class="pi-main"><span class="pi-name">自定义文件…</span><span class="pi-desc">选择本机 wav / mp3</span></span>'
       +    '<span class="pi-check" style="opacity:' + (roi.audio === 'custom' ? 1 : 0) + '">' + ic('check', 14) + '</span>'
       +  '</div>';
  pop.innerHTML = html;
  document.body.appendChild(pop);

  const r = trigger.getBoundingClientRect();
  const w = pop.offsetWidth, h = pop.offsetHeight;
  let left = r.left;
  if (left + w > window.innerWidth - 12) left = window.innerWidth - w - 12;
  let top = r.bottom + 6;
  if (top + h > window.innerHeight - 12) top = r.top - h - 6;
  pop.style.left = left + 'px';
  pop.style.top = top + 'px';

  pop.addEventListener('click', function(ev){
    const item = ev.target.closest('[data-pick]');
    if (!item) return;
    const pick = item.dataset.pick;
    if (pick === '__custom'){
      closePopover();
      openFileModal(roi);
      return;
    }
    roi.audio = pick;
    delete roi.customFile;
    closePopover();
    const p = audioById(pick);
    toast('「' + roi.label + '」报警音频设为 ' + p.name, 'music');
    playPreset(p, roi.volume);
    renderDetail();
  });

  activePopover = pop;
}
document.addEventListener('mousedown', function(e){
  if (!activePopover) return;
  if (e.target.closest('.popover') || e.target.closest('[data-act="open-audio"]')) return;
  closePopover();
});
window.addEventListener('resize', closePopover);

/* ============================================================
   颜色提取器
   ============================================================ */
const PALETTE_KEY = 'evewatch.palette';

function loadPalette(){
  try{
    const raw = localStorage.getItem(PALETTE_KEY);
    if (!raw) return;
    const custom = JSON.parse(raw);
    if (!Array.isArray(custom) || !custom.length) return;
    state.palette = DEFAULT_PALETTE.concat(custom.map(function(c){
      return { id:c.id, name:c.name, tag:'自定义', hex:c.hex, builtin:false };
    }));
  }catch(e){ /* 首次运行或本地存储不可用，使用内置色 */ }
}
function savePalette(){
  try{
    localStorage.setItem(PALETTE_KEY, JSON.stringify(
      state.palette.filter(function(p){ return !p.builtin; })
        .map(function(p){ return { id:p.id, name:p.name, hex:p.hex }; })
    ));
  }catch(e){ /* 本地存储不可用，本次会话内仍生效 */ }
}

function hexToRgb(hex){
  const n = parseInt(String(hex).replace('#',''), 16);
  return { r:(n >> 16) & 255, g:(n >> 8) & 255, b:n & 255 };
}
function rgbToHex(r, g, b){
  function to(v){
    const n = Math.max(0, Math.min(255, Math.round(isNaN(v) ? 0 : v)));
    return n.toString(16).padStart(2, '0');
  }
  return '#' + to(r) + to(g) + to(b);
}
function isHex(v){ return /^#?([0-9a-fA-F]{3}|[0-9a-fA-F]{6})$/.test(String(v).trim()); }
function normHex(v){
  let h = String(v).trim();
  if (h.charAt(0) !== '#') h = '#' + h;
  if (h.length === 4) h = '#' + h.charAt(1) + h.charAt(1) + h.charAt(2) + h.charAt(2) + h.charAt(3) + h.charAt(3);
  return h.toLowerCase();
}

/* 按当前 ROI 的图标列内容生成 16×16 可点击像素网格 */
function sampleGrid(roi){
  const hexOf = { red:'#ad0606', grey:'#6e6e6e', blue:'#3c78dc', orange:'#d2731f' };
  const seq = roi.hits > 0 ? ['blue','grey','red','grey'] : ['blue','grey','grey','blue'];
  const grid = [];
  for (let y = 0; y < 16; y++){
    const band = Math.floor(y / 4), inBand = y % 4, row = [];
    for (let x = 0; x < 16; x++){
      let c = '#12181e';
      if (x >= 6 && x <= 11 && inBand !== 3){
        c = (inBand === 1) ? '#c9ced3' : hexOf[seq[band]];
      }
      row.push(c);
    }
    grid.push(row);
  }
  return grid;
}

function openColorPicker(roiId){
  const acc = accById(state.selectedId);
  const roi = acc && acc.rois.find(function(r){ return r.id === roiId; });
  if (!roi){ toast('请先选择一个 ROI', 'alert'); return; }

  const host = $('#modalHost');
  const draft = { hex:'#ad0606', source:'当前 ROI 截图' };
  const gridHtml = sampleGrid(roi).map(function(row){
    return row.map(function(c){ return '<i style="background:' + c + '" data-hex="' + c + '"></i>'; }).join('');
  }).join('');

  function palItems(){
    return state.palette.map(function(p){
      return '<span class="pal-item"><span class="sw2" style="background:' + p.hex + '"></span>' + esc(p.name)
        + (p.builtin ? '' : '<button class="rm" data-del="' + p.id + '" title="从颜色库移除">' + ic('x', 11) + '</button>')
        + '</span>';
    }).join('');
  }

  const rgb0 = hexToRgb(draft.hex);

  pos:null,

};

function syncItems(){ return syncUI.scope === 'char' ? SYNC_CHARS : SYNC_ACCOUNTS; }
function syncTemplateId(){ return syncUI.scope === 'char' ? syncUI.templateId : syncUI.templateIdUser; }
function syncSetTemplate(id){
  if (syncUI.scope === 'char') syncUI.templateId = id;
  else syncUI.templateIdUser = id;
}
function syncProfile(id){
  return SYNC_PROFILES.find(function(p){ return p.id === id; }) || SYNC_PROFILES[0];
}
function syncName(it){ return it.name || it.alias || ('#' + it.id); }
function syncTemplate(){
  const items = syncItems();
  return items.find(function(i){ return i.id === syncTemplateId(); }) || items[0];
}
function syncIsSame(it, tpl){ return it.id !== tpl.id && it.size === tpl.size && it.mtime === tpl.mtime; }
function syncSelected(){
  const tpl = syncTemplate();
  const chosen = syncUI.targets[syncUI.scope] || [];
  return syncItems().filter(function(i){
    return i.id !== tpl.id && chosen.indexOf(i.id) !== -1;
  });
}
function syncInitTargets(){
  if (syncUI.targets[syncUI.scope]) return;
  const tplId = syncTemplateId();
  syncUI.targets[syncUI.scope] = syncItems()
    .filter(function(i){ return i.id !== tplId; })
    .map(function(i){ return i.id; });
}

function syncLogHtml(){
  return syncUI.log.map(function(l){
    return '<div class="' + l.cls + '"><span class="ts">' + l.ts + '</span>  ' + esc(l.text) + '</div>';
  }).join('');
}
function syncLog(cls, text){
  const d = new Date();
  const ts = [d.getHours(), d.getMinutes(), d.getSeconds()]
    .map(function(n){ return String(n).padStart(2, '0'); }).join(':');
  syncUI.log.push({ cls:cls, ts:ts, text:text });
  if (syncUI.log.length > 200) syncUI.log.shift();
  const box = document.getElementById('syncLogBox');
  if (box){ box.innerHTML = syncLogHtml(); box.scrollTop = box.scrollHeight; }
}
function syncStamp(){
  const d = new Date();
  return [d.getFullYear(), d.getMonth() + 1, d.getDate()].map(function(n){ return String(n).padStart(2, '0'); }).join('')
    + '_' + [d.getHours(), d.getMinutes(), d.getSeconds()].map(function(n){ return String(n).padStart(2, '0'); }).join('')
    + '_' + String(d.getMilliseconds()).padStart(3, '0');
}

function renderSync(){
  const host = $('#syncHost');
  if (!syncUI.visible){ host.innerHTML = ''; return; }

  const items = syncItems();
  const tpl = syncTemplate();
  const chosen = syncUI.targets[syncUI.scope] || [];
  const canAct = !syncUI.clientRunning;

  const rows = items.map(function(it){
    return { it:it, isSrc:it.id === tpl.id, same:syncIsSame(it, tpl), on:chosen.indexOf(it.id) !== -1 };
  });
  const picked = rows.filter(function(r){ return r.on && !r.isSrc; });
  const sameCount = picked.filter(function(r){ return r.same; }).length;
  const copyCount = picked.length - sameCount;

  function nameCell(it){
    if (syncUI.scope === 'user'){
      return '<input class="alias-inp" data-alias="' + it.id + '" value="' + esc(syncName(it)) + '" spellcheck="false" title="可编辑：给账号起别名，便于下次辨认">';
    }

      +   '<span class="row-main">' + nameCell(r.it) + rowSub(r.it) + '</span>'
      +   (r.isSrc ? '<span class="st src">模板</span>' : '')
      + '</div>';
  }).join('');

  const tgtRows = rows.filter(function(r){ return !r.isSrc; }).map(function(r){
    return '<div class="row' + (r.on ? ' on' : '') + '" data-tgt="' + r.it.id + '">'
      +   '<span class="cbox">' + ic('check', 11) + '</span>'
      +   '<span class="row-main">' + nameCell(r.it) + rowSub(r.it) + '</span>'
      +   '<span class="st ' + (r.same ? 'same' : 'diff') + '">' + (r.same ? '一致' : '待覆盖') + '</span>'
      + '</div>';
  }).join('');

  const opts = function(sel){
    return SYNC_PROFILES.map(function(p){

    }).join('');

    +       ' title="GameProcessGuard 检测 exefile / evelauncher。此处点击可切换模拟状态。">'
    +       ic(canAct ? 'shield' : 'alert', 11)

    +     '</span>'
    +     '<button class="btn ghost icon-only sm" id="syncClose" title="关闭">' + ic('x', 13) + '</button>'
    +   '</div>'

    +   '<div class="sync-toolbar">'
    +     '<span class="fld"><span class="k">源</span><span class="selwrap">'
    +       '<select class="sel" id="syncSrc">' + opts(syncUI.srcProfile) + '</select>'
    +       '<span class="selcaret">' + ic('chevronDown', 14) + '</span></span></span>'
    +     '<span class="fld"><span class="k">目标</span><span class="selwrap">'
    +       '<select class="sel" id="syncDst">' + opts(syncUI.dstProfile) + '</select>'
    +       '<span class="selcaret">' + ic('chevronDown', 14) + '</span></span></span>'
    +     '<span class="fld"><span class="k">范围</span><span class="seg" id="syncScope">'
    +       '<button data-scope="char" class="' + (syncUI.scope === 'char' ? 'on' : '') + '"'
    +         ' title="core_char：UI 布局 / 总览 / 快捷键">角色</button>'
    +       '<button data-scope="user" class="' + (syncUI.scope === 'user' ? 'on' : '') + '"'
    +         ' title="core_user：窗口位置与尺寸 / 硬件 / 分辨率">账号</button>'
    +     '</span></span>'
    +     '<button class="btn ghost icon-only sm" id="syncRescan" title="重新扫描设置目录">' + ic('refresh', 13) + '</button>'
    +   '</div>'

    +   '<div class="sync-warn' + (canAct ? '' : ' blocked') + '">' + ic('alert', 14) + '<span>'
    +     (canAct
        ? '执行前必须完全关闭 EVE 客户端与启动器，否则客户端退出时会回写设置、覆盖本次改动。克隆会连带聊天频道设置，存在 alt 暴露风险；建议目标与模板使用相同分辨率。'
        : '检测到 EVE 客户端正在运行，克隆已锁定。请先退出全部客户端与启动器，再点上方状态条重新检测。')

    +   '<div class="sync-cols">'

    +     '</div>'
    +     '<div class="pane">'
    +       '<div class="pane-head"><span class="pane-title">目标（多选）</span>'
    +         '<div class="tb-spacer"></div>'
    +         '<button class="mini-btn" id="syncAll">全选</button>'
    +         '<button class="mini-btn" id="syncInvert">反选</button>'
    +         '<button class="mini-btn" id="syncClear">清空</button>'
    +       '</div>'
    +       '<div class="pane-box">' + (tgtRows || '<div class="hint" style="padding:10px">没有可用的目标</div>') + '</div>'
    +     '</div>'
    +   '</div>'

    +   '<div class="sync-foot">'
    +     '<span class="sync-status" id="syncStatus">已选 <b>' + picked.length + '</b> 个目标 · 将覆盖 <b>' + copyCount
    +       '</b> 个 · 其中 <b>' + sameCount + '</b> 个内容已一致（跳过）</span>'
    +     '<button class="btn" id="syncPreview"' + (canAct ? '' : ' disabled') + '>' + ic('eye', 14) + '预览 (Dry-run)</button>'
    +     '<button class="btn primary" id="syncRun"' + (canAct ? '' : ' disabled') + '>' + ic('copy', 14) + '执行克隆</button>'
    +     '<button class="btn" id="syncBackup">' + ic('folder', 14) + '备份管理</button>'
    +     '<button class="btn" id="syncRestore"' + (syncUI.snapshot && canAct ? '' : ' disabled') + '>' + ic('refresh', 14) + '还原本次</button>'
    +   '</div>'

    +   '<div class="sync-log" id="syncLogBox">' + syncLogHtml() + '</div>'

    win.style.left = syncUI.pos.left + 'px';
    win.style.top = syncUI.pos.top + 'px';

    win.style.left = Math.max(12, Math.round((window.innerWidth - w) / 2)) + 'px';

  }

  box.scrollTop = box.scrollHeight;

  bindSync();

function bindSync(){
  const win = $('#syncWin');
  if (!win) return;

  $('#syncClose').addEventListener('click', function(){ toggleSync(false); });

  $('#syncGuard').addEventListener('click', function(){
    syncUI.clientRunning = !syncUI.clientRunning;
    syncLog(syncUI.clientRunning ? 'l-warn' : 'l-ok', syncUI.clientRunning
      ? 'GameProcessGuard：检测到 exefile ×3、evelauncher ×1，克隆已锁定'
      : 'GameProcessGuard：未检测到客户端进程，可以写入设置文件');
    toast(syncUI.clientRunning ? '已锁定：模拟客户端运行中' : '客户端未运行，可执行克隆',
      syncUI.clientRunning ? 'alert' : 'shield');
    renderSync();
  });

  $('#syncSrc').addEventListener('change', function(){
    syncUI.srcProfile = this.value;
    syncLog('l-info', '源 Profile → ' + syncProfile(this.value).folder);
  });
  $('#syncDst').addEventListener('change', function(){
    syncUI.dstProfile = this.value;
    syncLog('l-info', '目标 Profile → ' + syncProfile(this.value).folder);
  });

  $('#syncScope').addEventListener('click', function(e){
    const b = e.target.closest('[data-scope]');
    if (!b || b.dataset.scope === syncUI.scope) return;
    syncUI.scope = b.dataset.scope;
    syncInitTargets();
    syncLog('l-info', '范围切换为 ' + (syncUI.scope === 'char'
      ? '角色 · core_char_*.dat（UI 布局 / 总览 / 快捷键）'
      : '账号 · core_user_*.dat（窗口位置与尺寸 / 硬件 / 分辨率）'));
    renderSync();
  });

  $('#syncRescan').addEventListener('click', function(){
    syncLog('l-info', '重新扫描 %LOCALAPPDATA%\\CCP\\EVE  →  发现 ' + SYNC_PROFILES.length + ' 个 Profile');
    syncLog('l-ok', '扫描到 ' + syncItems().length + ' 个 core_' + (syncUI.scope === 'char' ? 'char' : 'user') + '_*.dat');
    toast('已重新扫描设置目录', 'refresh');
  });

  $$('.row[data-tgt]', win).forEach(function(row){
    row.addEventListener('click', function(e){
      if (e.target.closest('.alias-inp')) return;
      const id = +row.dataset.tgt;
      const arr = syncUI.targets[syncUI.scope] || (syncUI.targets[syncUI.scope] = []);
      const i = arr.indexOf(id);
      if (i === -1) arr.push(id); else arr.splice(i, 1);
      renderSync();
    });
  });

  $$('.row[data-tpl]', win).forEach(function(row){
    row.addEventListener('click', function(e){
      if (e.target.closest('.alias-inp') || row.classList.contains('src')) return;
      const id = +row.dataset.tpl;
      syncSetTemplate(id);
      const arr = syncUI.targets[syncUI.scope];
      if (arr){
        const i = arr.indexOf(id);
        if (i !== -1) arr.splice(i, 1);
      }
      syncLog('l-info', '模板改为 ' + syncName(syncTemplate()));
      renderSync();
    });
  });

  $$('.alias-inp', win).forEach(function(inp){
    inp.addEventListener('input', function(){
      const it = syncItems().find(function(x){ return x.id === +inp.dataset.alias; });
      if (it){ it.alias = inp.value; }
    });
  });

  $('#syncAll').addEventListener('click', function(){
    syncUI.targets[syncUI.scope] = syncItems()
      .filter(function(i){ return i.id !== syncTemplateId(); })
      .map(function(i){ return i.id; });
    renderSync();
  });
  $('#syncInvert').addEventListener('click', function(){
    const cur = syncUI.targets[syncUI.scope] || [];
    syncUI.targets[syncUI.scope] = syncItems()
      .filter(function(i){ return i.id !== syncTemplateId() && cur.indexOf(i.id) === -1; })
      .map(function(i){ return i.id; });
    renderSync();
  });
  $('#syncClear').addEventListener('click', function(){
    syncUI.targets[syncUI.scope] = [];
    renderSync();
  });

  $('#syncPreview').addEventListener('click', function(){
    const tpl = syncTemplate();
    const sel = syncSelected();
    if (!sel.length){ syncLog('l-warn', '未选择任何目标'); toast('请先选择目标', 'alert'); return; }
    const copy = sel.filter(function(i){ return !syncIsSame(i, tpl); });
    const same = sel.filter(function(i){ return syncIsSame(i, tpl); });
    syncLog('l-info', '──────── 预览（Dry-run）────────');
    syncLog('l-info', '模板 ' + syncName(tpl) + '  →  ' + sel.length + ' 个目标');
    if (copy.length) syncLog('l-ok', '将覆盖 ' + copy.length + ' 个：' + copy.map(syncName).join('、'));
    if (same.length) syncLog('l-info', '跳过 ' + same.length + ' 个（内容已一致）：' + same.map(syncName).join('、'));
    syncLog('l-info', '备份目录 ' + SyncPaths.backupRoot(syncProfile(syncUI.dstProfile)) + '\\' + syncStamp());
    toast('预览已写入日志', 'eye');
  });

  $('#syncRun').addEventListener('click', function(){
    if (syncUI.clientRunning){
      syncLog('l-err', '拒绝执行：检测到 EVE 客户端正在运行，退出时会把设置回写覆盖');
      toast('请先关闭全部 EVE 客户端', 'alert');
      return;
    }
    const tpl = syncTemplate();
    const sel = syncSelected();
    if (!sel.length){ syncLog('l-warn', '未选择任何目标'); toast('请先选择目标', 'alert'); return; }

    const copy = sel.filter(function(i){ return !syncIsSame(i, tpl); });
    const same = sel.filter(function(i){ return syncIsSame(i, tpl); });
    const dim = syncUI.scope === 'char' ? 'char' : 'user';

    syncUI.snapshot = syncItems().map(function(i){
      return { id:i.id, size:i.size, mtime:i.mtime, alias:i.alias };
    });

    syncLog('l-info', '──────── 执行克隆 ────────');
    if (!copy.length){
      syncLog('l-info', '全部目标内容已一致，无需覆盖');
      toast('所有目标内容已一致，无需覆盖', 'check');
      return;
    }
    syncLog('l-ok', '备份 ' + copy.length + ' 个文件 → ' + SyncPaths.backupRoot(syncProfile(syncUI.dstProfile)) + '\\' + syncStamp());
    copy.forEach(function(i){
      syncLog('l-ok', '覆盖 core_' + dim + '_' + i.id + '.dat  (' + syncName(i) + ')  哈希校验通过');
    });
    same.forEach(function(i){
      syncLog('l-info', '跳过 core_' + dim + '_' + i.id + '.dat  (' + syncName(i) + ')  内容已一致');
    });
    copy.forEach(function(i){
      i.size = tpl.size;
      i.mtime = tpl.mtime;
    });
    syncLog('l-ok', '完成：覆盖 ' + copy.length + ' · 跳过 ' + same.length + ' · 失败 0');

    pushEvent('info', 'EveWatch', '客户端设置已同步',
      esc(syncName(tpl)) + ' → ' + copy.length + ' 个' + (syncUI.scope === 'char' ? '角色' : '账号'));
    toast('已覆盖 ' + copy.length + ' 个设置文件', 'check');
    renderSync();
  });

  $('#syncBackup').addEventListener('click', function(){
    syncLog('l-info', '备份根目录  ' + SyncPaths.backupRoot(syncProfile(syncUI.dstProfile)));
    syncLog('l-info', '  20261016_143207_412   10 个文件');
    syncLog('l-info', '  20261015_091133_887   10 个文件');
    toast('备份目录已列出（演示）', 'folder');
  });

  $('#syncRestore').addEventListener('click', function(){
    if (!syncUI.snapshot) return;
    const items = syncItems();
    let n = 0;
    syncUI.snapshot.forEach(function(s){
      const it = items.find(function(x){ return x.id === s.id; });
      if (!it) return;
      it.size = s.size;
      it.mtime = s.mtime;
      if (s.alias !== undefined) it.alias = s.alias;
      n++;
    });
    syncLog('l-ok', '已从本次备份还原 ' + n + ' 个文件，回到克隆前状态');
    syncUI.snapshot = null;
    toast('已还原到克隆前状态', 'refresh');
    renderSync();
  });
}

/* 路径来源对应 EveSync 的 SettingsRootLocator / SettingsBackupService */
const SyncPaths = {
  root: '%LOCALAPPDATA%\\CCP\\EVE',
  backupRoot: function(profile){ return '%APPDATA%\\EveWatch\\SettingsBackups\\' + profile.folder; }
};

function toggleSync(force){
  syncUI.visible = (force === undefined) ? !syncUI.visible : force;
  $('#btnLayoutSync').setAttribute('aria-pressed', String(syncUI.visible));
  if (!syncUI.visible){
    syncUI.pos = null;
    $('#syncHost').innerHTML = '';
    return;
  }
  if (!syncUI.started){
    syncUI.started = true;
    syncInitTargets();
    syncLog('l-info', '定位设置根目录 ' + SyncPaths.root);
    syncLog('l-info', '发现 ' + SYNC_PROFILES.length + ' 个 Profile（settings_*）');
    syncLog('l-ok', '扫描到 ' + SYNC_CHARS.length + ' 个 core_char_*.dat、' + SYNC_ACCOUNTS.length + ' 个 core_user_*.dat');
    syncLog('l-warn', '执行前请关闭全部 EVE 客户端与启动器');
  }
  renderSync();
  toast('游戏布局同步已打开', 'layoutTemplate');
}

/* ============================================================
   ROI 并排显示 · 置顶窗
   ============================================================ */
function wallBlocks(roi, seed){
  let out = '';
  for (let i = 0; i < 15; i++){
    let bg = '#141a20';
    const k = (i * 7 + seed * 5) % 13;
    if (k === 2 || k === 9 || k === 11) bg = 'var(--st-grey)';
    if (k === 5) bg = 'var(--st-blue)';
    if (roi.hits > 0 && i === 5) bg = 'var(--st-red)';
    out += '<i style="background:' + bg + '"></i>';
  }
  return out;
}

function wallColumns(){
  const cols = [];
  state.accounts.forEach(function(a){
    if (!a.enabled) return;
    a.rois.forEach(function(roi, i){
      if (!roi.enabled) return;
      cols.push({ acc:a, roi:roi, idx:i });
    });
  });
  return cols;
}

function renderWall(){
  const host = $('#wallHost');
  if (!state.wallVisible){ host.innerHTML = ''; return; }

  const cols = wallColumns();
  const alarms = cols.filter(function(c){ return c.roi.hits > 0; }).length;
  const strips = cols.map(function(c, i){
    const cls = ['wall-strip'];
    if (c.roi.hits > 0) cls.push('alarm');
    if (state.focusedId === c.acc.id) cls.push('focused');
    return '<div class="' + cls.join(' ') + '" data-acc="' + c.acc.id + '" data-roi="' + c.roi.id + '"'
      + ' title="' + esc(c.acc.name) + ' · ' + esc(c.roi.label) + '（双击切到该客户端）">'
      +   '<div class="wall-name">' + esc(c.acc.name) + '</div>'
      +   '<div class="wall-col">' + wallBlocks(c.roi, i) + '</div>'
      +   '<div class="wall-tag">R' + (c.idx + 1) + '</div>'
      + '</div>';
  }).join('');

  host.innerHTML = ''
    + '<div class="wall" id="wallWin" data-winbox="wall">'
    +   '<div class="wall-bar" id="wallBar">'
    +     ic('layoutGrid', 14)
    +     '<span class="wall-title">ROI 并排</span>'
    +     '<span class="wall-pin">' + ic('pin', 11) + '永远最前</span>'
    +     '<span class="wall-stat">' + cols.length + ' 路 · 报警 ' + alarms + '</span>'
    +     '<button class="btn ghost icon-only sm" id="wallClose" title="关闭">' + ic('x', 13) + '</button>'
    +   '</div>'
    +   '<div class="wall-body">'
    +     (strips || '<div style="padding:14px; font-size:12px; color:var(--text-dim)">没有启用的 ROI</div>')
    +   '</div>'
    + '</div>';

  const win = $('#wallWin');
  if (state.wallPos){
    win.style.left = state.wallPos.left + 'px';
    win.style.top = state.wallPos.top + 'px';
  } else {
    const w = win.offsetWidth, h = win.offsetHeight;
    win.style.left = Math.max(12, window.innerWidth - w - 26) + 'px';
    win.style.top = Math.max(56, window.innerHeight - h - 54) + 'px';
  }
  $('#wallClose').addEventListener('click', function(){ toggleWall(false); });
}

function focusAccount(a){
  state.selectedId = a.id;
  state.focusedId = a.id;
  renderAccounts();
  renderDetail();
  renderWall();
  toast('已切到 ' + a.name + '（演示：置前该客户端窗口）', 'monitor');
}

function toggleWall(force){
  state.wallVisible = (force === undefined) ? !state.wallVisible : force;
  $('#btnWall').setAttribute('aria-pressed', String(state.wallVisible));
  if (!state.wallVisible) state.wallPos = null;
  renderWall();
  toast(state.wallVisible ? 'ROI 并排已打开，窗口保持最前' : 'ROI 并排已关闭', 'layoutGrid');
}

/* 浮动窗口拖动（ROI 并排 / 游戏布局同步 共用） */
let winDrag = null;
document.addEventListener('mousedown', function(e){
  if (e.target.closest('button') || e.target.closest('select') || e.target.closest('#syncGuard')) return;
  const bar = e.target.closest('#wallBar, #syncBar');
  if (!bar) return;
  const win = bar.closest('[data-winbox]');
  if (!win) return;
  winDrag = { key:win.dataset.winbox, sx:e.clientX, sy:e.clientY, ox:win.offsetLeft, oy:win.offsetTop };
  e.preventDefault();
});
document.addEventListener('mousemove', function(e){
  if (!winDrag) return;
  const win = document.querySelector('[data-winbox="' + winDrag.key + '"]');
  if (!win){ winDrag = null; return; }
  const left = Math.max(4, Math.min(window.innerWidth - 90, winDrag.ox + e.clientX - winDrag.sx));
  const top = Math.max(4, Math.min(window.innerHeight - 44, winDrag.oy + e.clientY - winDrag.sy));
  win.style.left = left + 'px';
  win.style.top = top + 'px';
  if (winDrag.key === 'wall') state.wallPos = { left:left, top:top };
  else syncUI.pos = { left:left, top:top };
});
document.addEventListener('mouseup', function(){ winDrag = null; });

document.addEventListener('dblclick', function(e){
  const strip = e.target.closest('.wall-strip');
  if (!strip) return;
  const a = accById(strip.dataset.acc);
  if (!a) return;
  focusAccount(a);
});

/* ============================================================
   账号配置克隆
   ============================================================ */
function cloneOptions(){
  return [
    { id:'rois',   label:'ROI 列表与区域', desc:'含每个 ROI 的名称、坐标、尺寸与启用状态', on:true },
    { id:'colors', label:'命中颜色',       desc:'每个 ROI 判定的 standing 颜色',           on:true },
    { id:'audio',  label:'报警音频与音量', desc:'每个 ROI 独立绑定的音频与音量',            on:true },
    { id:'enable', label:'启用状态',       desc:'账号是否参与监控（默认不克隆）',           on:false }
  ];
}

function openCloneModal(){
  const src = accById(state.selectedId);
  if (!src){ toast('请先在左侧选择一个账号', 'alert'); return; }
  const targets = state.accounts.filter(function(a){ return a.id !== src.id; });
  const opts = cloneOptions();
  const host = $('#modalHost');

  function draw(){
    const rows = opts.map(function(o){
      return '<div class="opt' + (o.on ? ' on' : '') + '" data-opt="' + o.id + '" role="checkbox" aria-checked="' + o.on + '">'
        +   '<span class="checkbox">' + ic('check', 12) + '</span>'
        +   '<span class="opt-main"><span class="opt-label">' + o.label + '</span>'
        +   '<span class="opt-desc">' + o.desc + '</span></span>'
        + '</div>';
    }).join('');

    host.innerHTML = ''
      + '<div class="backdrop" id="cloneBackdrop">'
      +   '<div class="modal" style="width:478px" role="dialog" aria-label="账号配置克隆">'
      +     '<div class="modal-head">' + ic('copy', 16) + '<h3>账号配置克隆</h3></div>'
      +     '<div class="modal-body">'
      +       '<div class="src-box">'
      +         '<span class="k">源账号</span><span class="v">' + esc(src.name) + '</span>'
      +         '<span class="arrow">' + ic('arrowLeftRight', 14) + '</span>'
      +         '<span class="k">目标</span><span class="to">全部 ' + targets.length + ' 个账号</span>'
      +       '</div>'
      +       '<div class="opt-list">' + rows + '</div>'
      +       '<div class="notice">' + ic('alert', 14)
      +         '<span>目标账号的对应设置会被覆盖，未勾选的项目保持不变。此操作不可撤销。</span>'
      +       '</div>'
      +     '</div>'
      +     '<div class="modal-foot">'
      +       '<button class="btn" id="btnCloneCancel">取消</button>'
      +       '<button class="btn primary" id="btnCloneOk">克隆到全部账号</button>'
      +     '</div>'
      +   '</div>'
      + '</div>';
    hydrateIcons(host);

    $$('[data-opt]', host).forEach(function(el){
      el.addEventListener('click', function(){
        const o = opts.find(function(x){ return x.id === el.dataset.opt; });
        o.on = !o.on;
        draw();
      });
    });
    $('#btnCloneCancel').addEventListener('click', function(){ host.innerHTML = ''; });
    $('#cloneBackdrop').addEventListener('mousedown', function(e){
      if (e.target.id === 'cloneBackdrop') host.innerHTML = '';
    });
    $('#btnCloneOk').addEventListener('click', function(){
      if (!opts.some(function(o){ return o.on; })){ toast('至少勾选一项', 'alert'); return; }
      applyClone(src, targets, opts);
      host.innerHTML = '';
    });
  }
  draw();
}

function applyClone(src, targets, opts){
  const want = {};
  opts.forEach(function(o){ want[o.id] = o.on; });
  let stamp = Date.now();

  targets.forEach(function(a){
    if (want.rois){
      a.rois = src.rois.map(function(r){
        stamp += 1;
        return Object.assign({}, r, { id:'r' + stamp, hits:0, lastHit:'—' });
      });
    }
    if (want.colors || want.audio){
      a.rois.forEach(function(roi, i){
        const from = src.rois[i];
        if (!from) return;
        if (want.colors) roi.colors = from.colors.slice();
        if (want.audio){
          roi.audio = from.audio;
          roi.volume = from.volume;
          if (from.audio === 'custom' && from.customFile) roi.customFile = from.customFile;
          else delete roi.customFile;
        }
      });
    }
    if (want.enable) a.enabled = src.enabled;
  });

  const picked = opts.filter(function(o){ return o.on; }).map(function(o){ return o.label; }).join('、');
  pushEvent('info', 'EveWatch', '账号配置已克隆',
    esc(src.name) + ' → ' + targets.length + ' 个账号（' + picked + '）');
  toast('已克隆到 ' + targets.length + ' 个账号', 'copy');
  renderAll();
}

/* ============================================================
   Toolbar actions
   ============================================================ */
$('#btnMonitor').addEventListener('click', function(){
  state.monitoring = !state.monitoring;
  pushEvent(state.monitoring ? 'info' : 'warn', 'EveWatch',
    state.monitoring ? '监控已启动' : '监控已停止',
    state.monitoring ? (state.accounts.filter(function(a){ return a.enabled; }).length + ' / ' + state.accounts.length + ' 客户端') : '所有轮询线程已停止');
  renderAll();
});

$('#btnMute').addEventListener('click', function(){
  state.muted = !state.muted;
  toast(state.muted ? '已全局静音，事件仍然记录' : '已恢复声音', state.muted ? 'volumeX' : 'volume2');
  renderToolbar();
});

$('#btnSelectAll').addEventListener('click', function(){
  const anyOff = state.accounts.some(function(a){ return !a.enabled; });
  state.accounts.forEach(function(a){ a.enabled = anyOff; });
  toast(anyOff ? '已启用全部 ' + state.accounts.length + ' 个账号' : '已停用全部账号', anyOff ? 'play' : 'pause');
  renderAll();
});
$('#btnInvert').addEventListener('click', function(){
  state.accounts.forEach(function(a){ a.enabled = !a.enabled; });
  const on = state.accounts.filter(function(a){ return a.enabled; }).length;
  toast('已反选，' + on + ' / ' + state.accounts.length + ' 个账号启用', 'arrowLeftRight');
  renderAll();
});
$('#btnClone').addEventListener('click', openCloneModal);
$('#btnWall').addEventListener('click', function(){ toggleWall(); });
$('#btnLayoutSync').addEventListener('click', function(){ toggleSync(); });

$('#btnSettings').addEventListener('click', function(){ toast('设置面板待接入', 'settings'); });
$('#btnRefresh').addEventListener('click', function(){
  toast('已重新枚举客户端窗口', 'refresh');
  pushEvent('info', 'EveWatch', '账号台账已刷新', state.accounts.length + ' 个窗口');
  renderEvents();
});
$('#btnClearLog').addEventListener('click', function(){
  state.events = [];
  renderEvents();
  toast('事件列表已清空', 'trash');
});

function pushEvent(kind, acc, text, note){
  const d = new Date();
  const t = [d.getHours(), d.getMinutes(), d.getSeconds()].map(function(n){ return String(n).padStart(2, '0'); }).join(':');
  state.events.unshift({ t:t, kind:kind, acc:acc, text:text, note:note || '' });
}

$('#btnDemo').addEventListener('click', function(){
  const target = accById(state.selectedId) || state.accounts[0];
  if (!target.rois.length){ toast('该账号尚未添加 ROI，无法模拟报警', 'alert'); return; }
  const roi = target.rois.find(function(r){ return r.enabled; }) || target.rois[0];
  const d = new Date();
  const t = [d.getHours(), d.getMinutes(), d.getSeconds()].map(function(n){ return String(n).padStart(2, '0'); }).join(':');

  target.hostile = true;
  target.lastAlarm = t;
  roi.hits += 1;
  roi.lastHit = t;
  pushEvent('hit', target.name, '<b>' + esc(roi.label) + '</b> 命中 红 ×2', '触发报警：' + audioLabel(roi));
  renderAll();

  const row = accList.querySelector('.acc-row[data-id="' + target.id + '"]');
  if (row){ row.classList.add('flash'); setTimeout(function(){ row.classList.remove('flash'); }, 1500); }

  playRoi(roi);
  setTimeout(function(){
    target.hostile = false;
    renderAll();
  }, 6000);
});

/* ============================================================
   Boot
   ============================================================ */
loadOrder();
loadPalette();
hydrateIcons(document);
// 账号列表每次重绘后，行需要重新标记为可拖动
const observer = new MutationObserver(function(){
  $$('.acc-row', accList).forEach(function(r){ r.draggable = true; });
});
observer.observe(accList, { childList:true });
renderAll();
pushEvent('info', 'EveWatch', '监控已启动', state.accounts.filter(function(a){ return a.enabled; }).length + ' / ' + state.accounts.length + ' 客户端');
renderEvents();
</script>
